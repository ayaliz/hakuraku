<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-label="Effect of one + legacy copy">
<style>
        .grid { stroke: #d1d5db; stroke-width: 1; }
        .axis { stroke: #111827; stroke-width: 1.5; }
        .tick { fill: #475569; font: 12px system-ui, sans-serif; }
        .label { fill: #111827; font: 14px system-ui, sans-serif; font-weight: 700; }
        .value { fill: #111827; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 800; }
        .title { fill: #111827; font: 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 800; }
        .subtitle { fill: #64748b; font: 13px system-ui, sans-serif; }
        .legend { fill: #334155; font: 13px system-ui, sans-serif; }
        </style>
<rect width="920" height="410" rx="6" fill="#ffffff"/>
<text x="54" y="34" class="title">Effect of one + legacy copy</text>
<text x="54" y="58" class="subtitle">Odds ratios with character-clustered 95% confidence intervals</text>
<line x1="388.9" y1="82" x2="388.9" y2="330" class="grid"/>
<text x="388.9" y="354" class="tick" text-anchor="middle">0.9x</text>
<line x1="526.8" y1="82" x2="526.8" y2="330" class="axis"/>
<text x="526.8" y="354" class="tick" text-anchor="middle">1.0x</text>
<line x1="664.6" y1="82" x2="664.6" y2="330" class="grid"/>
<text x="664.6" y="354" class="tick" text-anchor="middle">1.1x</text>
<line x1="802.4" y1="82" x2="802.4" y2="330" class="grid"/>
<text x="802.4" y="354" class="tick" text-anchor="middle">1.2x</text>
<text x="302" y="120" class="label" text-anchor="end">Matching scenario: normal version</text>
<line x1="427.3" y1="115" x2="452.0" y2="115" stroke="#0f766e" stroke-width="4"/>
<line x1="427.3" y1="108" x2="427.3" y2="122" stroke="#0f766e" stroke-width="2"/>
<line x1="452.0" y1="108" x2="452.0" y2="122" stroke="#0f766e" stroke-width="2"/>
<circle cx="439.6" cy="115" r="7" fill="#0f766e"/>
<text x="842" y="120" class="value">0.937x</text>
<text x="302" y="178" class="label" text-anchor="end">Matching scenario: + version</text>
<line x1="734.5" y1="173" x2="759.5" y2="173" stroke="#e45b43" stroke-width="4"/>
<line x1="734.5" y1="166" x2="734.5" y2="180" stroke="#e45b43" stroke-width="2"/>
<line x1="759.5" y1="166" x2="759.5" y2="180" stroke="#e45b43" stroke-width="2"/>
<circle cx="746.9" cy="173" r="7" fill="#e45b43"/>
<text x="842" y="178" class="value">1.160x</text>
<text x="302" y="236" class="label" text-anchor="end">Matching scenario: either version</text>
<line x1="644.5" y1="231" x2="667.5" y2="231" stroke="#2563eb" stroke-width="4"/>
<line x1="644.5" y1="224" x2="644.5" y2="238" stroke="#2563eb" stroke-width="2"/>
<line x1="667.5" y1="224" x2="667.5" y2="238" stroke="#2563eb" stroke-width="2"/>
<circle cx="656.0" cy="231" r="7" fill="#2563eb"/>
<text x="842" y="236" class="value">1.094x</text>
<text x="302" y="294" class="label" text-anchor="end">Non-matching scenario: normal version</text>
<line x1="485.3" y1="289" x2="646.2" y2="289" stroke="#7c3aed" stroke-width="4"/>
<line x1="485.3" y1="282" x2="485.3" y2="296" stroke="#7c3aed" stroke-width="2"/>
<line x1="646.2" y1="282" x2="646.2" y2="296" stroke="#7c3aed" stroke-width="2"/>
<circle cx="563.5" cy="289" r="7" fill="#7c3aed"/>
<text x="842" y="294" class="value">1.027x</text>
<text x="402.7" y="385" class="subtitle" text-anchor="middle">Lower odds</text>
<text x="705.9" y="385" class="subtitle" text-anchor="middle">Higher odds</text>
</svg>
